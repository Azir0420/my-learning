<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch8.forms(表單)</title>
    <link rel="stylesheet" href="css/myall.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <div class="container py-5">
        <div class="display-2 fw900 text-center mt-4 text-bg-success p-3">Ch.8.Forms表單</div>
        <div class="display-5 fw900 mt-3 text-primary p-3">1.基本表單樣式</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">帳號:</label>
                    <input type="text" class="form-control" id="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼:</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">密碼:</label>
                    <input type="email" class="form-control form-control-lg " id="email">
                </div>
                <div class="mb-3">
                    <label for="number" class="form-label">人數:</label>
                    <input type="number" class="form-control form-control-lg " id="number" min="0" max="10" value="1">
                </div>
                <div class="mb-3">
                    <label for="formfile" class="form-label">帳號:</label>
                    <input type="file" class="form-control" id="formfile">
                </div>
                <div class="">
                    <label class="form-label" for="foodlist">點餐</label>
                    <input type="text" class="form-control" id="foodlist" list="datalistOption">
                    <datalist id="datalistOption">

                        <option value="漢堡"></option>
                        <option value="拉麵"></option>
                        <option value="壽司"></option>
                        <option value="牛肉麵"></option>
                    </datalist>
                </div>
            </div>
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">2.下拉選單(select)</div>
        <div class="row">
            <div class="col-12">
                <label for="" class="form-label">縣市:</label>
                <select name="" id="" class="form-control form-select-lg">
                    <option value="" class="text-center" disabled selected>-----請選擇縣市-----</option>
                    <option value="臺中市">臺中市</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="臺南市">臺南市</option>
                </select>
            </div>
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">3.checkboc(複選)，radio(單選)</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" name="" id="chk01">
                    <label for="chk01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" name="" id="chk02">
                    <label for="chk02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" name="" id="chk03">
                    <label for="chk03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" name="" id="chk04">
                    <label for="chk04" class="form-check-label">選項04</label>
                </div>

            </div>
            <hr class="my-3">
            <div class="col-12">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad01">
                    <label for="rad01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad02">
                    <label for="rad02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad03">
                    <label for="rad03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad04">
                    <label for="rad04" class="form-check-label">選項04</label>
                </div>
            </div>

        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">4.switch</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="" id="">
                    <label for="" class="form-check-label">開燈/關燈</label>
                </div>
            </div>
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">5.range</div>
        <div class="mb-3">
            <label for="range01" class="form-label">數量:99個</label>
            <input type="range" class="form-range" id="range01" min="1" max="100" step="1" value="1" style="">
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">6.input-group</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 input-group">
                    <span class="input-group-text">帳號</span>
                    <input type="text" class="form-control">
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    <input type="text" class="form-control">
                    <span class="input-group-text ">@gmail.com</span>
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="1" max="1000" step="1" value="100" class="form-control">
                    <span class="input-group-text">NT</span>
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    
                    <input type="text" class="form-control-lg form-control" name="" id="">
                    <button class="btn btn-primary">搜尋</button>
                </div>
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">7.Floating Label(浮動標籤)</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 form-floating">
                    <input type="text"  class="form-control form-control-lg" placeholder="XXXX">
                    <label for="username" class="form-label">帳號</label>
                </div>
            </div>
        </div>
        <div class="display-5 fw900 mt-3 text-primary p-3">8.表單驗證</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 ">
                    <label for="username" class="form-label">帳號</label>
                    <input type="text" class="form-control is-valid" id="username" placeholder="請輸入一個大寫英文......">
                    <div class="valid-feedback">帳號輸入符合規定!</div>
                    <div class="invalid-feedback">帳號輸入不符合規定!</div>
                </div>
                <div class="mb-3">
                    <label for="passeord" class="form-label">密碼</label>
                    <input type="password" class="form-control is-valid" id="passeord" placeholder="請輸入一個大寫英文......">
                    <div class="valid-feedback">密碼輸入符合規定!</div>
                    <div class="invalid-feedback">密碼輸入不符合規定!</div>
                </div>
            </div>
        </div>


        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/jquery-4.0.0.js"></script>
</body>

</html>
